<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="smokedat-master-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241B17" />
      <stop offset="100%" stop-color="#0D0A09" />
    </linearGradient>

    <!-- Bottom Charcoal Ember Radiant Heat -->
    <radialGradient id="smokedat-master-ember-glow" cx="50%" cy="86%" r="54%">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.52" />
      <stop offset="55%" stop-color="#FF4500" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0" />
    </radialGradient>

    <!-- Tapered Smoke Ribbon Gradient (Fades smoothly at bottom & top tips) -->
    <linearGradient id="smokedat-master-smoke-wisp" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#9CA3AF" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.58" />
      <stop offset="75%" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#9CA3AF" stop-opacity="0" />
    </linearGradient>

    <!-- Hot Coal Core Gradient -->
    <linearGradient id="smokedat-master-coal-fire" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF2A00" />
      <stop offset="55%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FFD166" />
    </linearGradient>

    <!-- Lump Charcoal Facet Gradients (Ashy Grey Top -> Glowing Ember Underside) -->
    <linearGradient id="smokedat-master-lump-dark" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#3B3532" />
      <stop offset="48%" stop-color="#1C1715" />
      <stop offset="85%" stop-color="#5C1D08" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>

    <linearGradient id="smokedat-master-lump-ash" x1="0%" y1="0%" x2="15%" y2="100%">
      <stop offset="0%" stop-color="#6E6661" />
      <stop offset="42%" stop-color="#292320" />
      <stop offset="82%" stop-color="#8A2808" />
      <stop offset="100%" stop-color="#FF7B1C" />
    </linearGradient>

    <linearGradient id="smokedat-master-lump-hot" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2B2421" />
      <stop offset="55%" stop-color="#7A2207" />
      <stop offset="85%" stop-color="#F95715" />
      <stop offset="100%" stop-color="#FFB703" />
    </linearGradient>

    <!-- Primary Temperature Probe Curve Gradient -->
    <linearGradient id="smokedat-master-probe-grad" x1="15%" y1="75%" x2="88%" y2="25%">
      <stop offset="0%" stop-color="#FF9E44" />
      <stop offset="100%" stop-color="#FF4500" />
    </linearGradient>

    <!-- Soft Drop Shadow for Telemetry Line -->
    <filter id="smokedat-master-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="512" height="512" fill="url(#smokedat-master-bg)" />
  <rect width="512" height="512" fill="url(#smokedat-master-ember-glow)" />

  <!-- Subtle Dashboard Telemetry Grid (Hidden in Favicon Mode) -->
  
  <g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2" stroke-dasharray="6 8">
    <line x1="72" y1="132" x2="440" y2="132" />
    <line x1="72" y1="216" x2="440" y2="216" />
    <line x1="72" y1="300" x2="440" y2="300" />
  </g>

  <!-- THREE CRISP TAPERED SMOKE WISPS (Classic BBQ S-Curves, no closed ghost shape) -->
  <g fill="url(#smokedat-master-smoke-wisp)">
    <!-- Left Wisp -->
    <path d="M 164 345
             C 138 302, 186 266, 162 218
             C 144 182, 164 148, 184 126
             C 176 154, 166 180, 182 212
             C 208 262, 162 302, 178 345 Z" />

    <!-- Center Tall Wisp -->
    <path d="M 246 340
             C 214 286, 282 242, 248 182
             C 224 140, 248 96, 276 72
             C 264 104, 250 138, 272 176
             C 308 238, 242 286, 264 340 Z" />

    <!-- Right Wisp (Hidden in tiny 16px favicon mode to keep 2 bold wisps ultra-legible) -->
    
    <path d="M 328 345
             C 304 306, 348 272, 326 226
             C 310 194, 328 164, 346 144
             C 338 170, 330 192, 344 220
             C 368 266, 324 304, 340 345 Z" />
  </g>

  <!-- IRREGULAR HARDWOOD LUMP CHARCOAL BED (No flat oval; coals glow from crevices & undersides) -->
  <g>
    <!-- Tight Inter-Coal Incandescent Crevice Glow (Shaped strictly to the gaps between chunks) -->
    <polygon points="134,424 148,396 176,390 202,382 232,377 268,378 302,383 336,391 368,398 380,424 342,431 296,428 256,433 212,429 168,431"
             fill="url(#smokedat-master-coal-fire)"
             opacity="0.89" />

    <!-- Back-Row Lower-Profile Chunks (Peeking from behind with bright orange-red rims) -->
    <polygon points="154,398 169,381 196,379 207,396 184,404"
             fill="url(#smokedat-master-lump-hot)" stroke="#FF6B1A" stroke-width="2" stroke-linejoin="round" />
    <polygon points="222,394 238,374 271,376 283,393 254,401"
             fill="url(#smokedat-master-lump-hot)" stroke="#FF8C24" stroke-width="2.2" stroke-linejoin="round" />
    <polygon points="294,396 312,379 341,383 351,399 322,404"
             fill="url(#smokedat-master-lump-hot)" stroke="#FF6B1A" stroke-width="2" stroke-linejoin="round" />

    <!-- Foreground Irregular Hardwood Charcoal Chunks (Blocky, split-grain silhouettes) -->
    <!-- Far Left Chunk -->
    <polygon points="116,423 128,401 149,393 167,399 173,417 154,428 131,427"
             fill="url(#smokedat-master-lump-dark)" stroke="#E84E0F" stroke-width="2.2" stroke-linejoin="round" />

    <!-- Mid-Left Blocky Hardwood Chunk (Ashy grey top facet + glowing bottom edge) -->
    <polygon points="166,426 175,395 198,386 221,391 227,412 214,430 186,431"
             fill="url(#smokedat-master-lump-ash)" stroke="#FF7B1C" stroke-width="2.5" stroke-linejoin="round" />
    
    <polygon points="178,396 198,388 218,393 206,404 184,403" fill="#7D746E" opacity="0.45" />
    <line x1="184" y1="408" x2="213" y2="405" stroke="#120E0C" stroke-width="2" stroke-linecap="round" />

    <!-- Center Hero Lump Coal (Angled split wood block with hot red-orange underside) -->
    <polygon points="219,429 229,392 254,381 281,387 289,409 276,432 244,434"
             fill="url(#smokedat-master-lump-dark)" stroke="#FF9E2C" stroke-width="2.8" stroke-linejoin="round" />
    
    <polygon points="232,393 254,383 277,388 266,401 241,401" fill="#635B56" opacity="0.5" />
    <line x1="236" y1="411" x2="275" y2="407" stroke="#FF5500" stroke-width="1.8" stroke-opacity="0.7" stroke-linecap="round" />

    <!-- Mid-Right Split Hardwood Chunk -->
    <polygon points="282,430 292,394 316,386 339,393 345,415 329,429 301,432"
             fill="url(#smokedat-master-lump-ash)" stroke="#FF7B1C" stroke-width="2.5" stroke-linejoin="round" />
    
    <polygon points="295,395 316,388 335,394 323,405 301,404" fill="#7D746E" opacity="0.42" />

    <!-- Far Right Chunk -->
    <polygon points="338,426 347,400 369,393 388,402 394,421 374,429 351,428"
             fill="url(#smokedat-master-lump-dark)" stroke="#D9410B" stroke-width="2.2" stroke-linejoin="round" />

    <!-- Tiny Rising Sparks -->
    
    <circle cx="195" cy="364" r="3.2" fill="#FFB703" opacity="0.8" />
    <circle cx="298" cy="356" r="3.8" fill="#FF7A00" opacity="0.8" />
    <circle cx="244" cy="366" r="2.4" fill="#FFE066" opacity="0.8" />
    
  </g>

  <!-- Stainless Grill Grate Bar Above the Coals -->
  
  <g>
    <line x1="104" y1="366" x2="408" y2="366" stroke="#3A2E28" stroke-width="9" stroke-linecap="round" />
    <line x1="104" y1="364" x2="408" y2="364" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Secondary Probe Curve (Ambient Pit Temp) -->
  
  <path d="M 92 296 C 148 288, 192 246, 254 252 C 314 258, 356 212, 414 204" 
        fill="none" 
        stroke="#38BDF8" 
        stroke-width="13" 
        stroke-linecap="round" 
        stroke-opacity="0.92" />
  

  <!-- Primary Meat Probe Telemetry Curve (Climb -> BBQ Stall Plateau -> Target Temp) -->
  <g filter="url(#smokedat-master-shadow)">
    <path d="M 94 334 C 148 328, 176 232, 232 228 C 282 224, 304 226, 338 186 C 364 156, 386 138, 412 130" 
          fill="none" 
          stroke="url(#smokedat-master-probe-grad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Live Probe Sensor Node (Target Temperature Point) -->
  <circle cx="412" cy="130" r="30" fill="#FF4500" opacity="0.28" />
  <circle cx="412" cy="130" r="19" fill="#FFFFFF" stroke="#FF5500" stroke-width="8" />

  <!-- Secondary Probe Node -->
  
  <circle cx="254" cy="252" r="10" fill="#FFFFFF" stroke="#38BDF8" stroke-width="5.5" />
  

  <!-- Optional iOS Optical Safe-Zone Grid Overlay -->
  

  <!-- Subtle Inner Rim Highlight -->
  <rect x="2" y="2" width="508" height="508" rx="0" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="4" />
</svg>