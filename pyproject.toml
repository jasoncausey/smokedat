[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smokedat"
version = "0.1.0"
description = "Bluetooth-to-web bridge for iBBQ-protocol thermometers, with live charts, time-to-goal and phone alerts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bleak>=3.0",
    "aiohttp>=3.9",
    "pywebpush>=2.0",
]

[project.scripts]
smokedat = "smokedat.bridge:main"

[tool.hatch.build.targets.wheel]
packages = ["smokedat"]
